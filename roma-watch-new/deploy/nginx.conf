# =============================================================================
# Nginx config برای ROMA WATCH
# =============================================================================
# این فایل رو کپی کن به:  /etc/nginx/sites-available/romawatch
# بعد لینکش کن:            sudo ln -s /etc/nginx/sites-available/romawatch /etc/nginx/sites-enabled/
# تست کن:                  sudo nginx -t
# ری‌استارت:               sudo systemctl reload nginx
#
# قبل از استفاده، هرجا نوشته YOUR_DOMAIN.ir رو با دامنه‌ی واقعی و هرجا
# /var/www/roma-watch-new رو با مسیر واقعی پروژه روی VPS جایگزین کن.
# =============================================================================

# --- ریدایرکت خودکار HTTP به HTTPS (بعد از گرفتن گواهی SSL فعالش کن) ---
server {
    listen 80;
    server_name YOUR_DOMAIN.ir www.YOUR_DOMAIN.ir;

    # این بخش برای تایید دامنه توسط certbot لازمه، دستش نزن
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # بعد از گرفتن گواهی SSL (مرحله ۵ در DEPLOY.md)، این خط رو از کامنت دربیار
    # و بقیه‌ی location های پایین همین بلاک رو پاک کن:
    # return 301 https://$host$request_uri;

    # --- تا قبل از گرفتن SSL، سایت مستقیم از همینجا (پورت ۸۰) سرو میشه ---
    root /var/www/roma-watch-new;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri.htm $uri/ =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # backend/ حتماً باید مسدود باشه - شامل backend/data/*.json (اطلاعات واقعی
    # کاربرها و سفارش‌ها) و backend/.env (رمزهای سرویس‌ها) میشه. اگه این بلاک
    # نباشه، این فایل‌ها مستقیم از روی دامنه قابل دانلودن.
    # فایل‌های داخلی پروژه نباید از بیرون قابل دانلود باشن
    location ~* ^/(DEPLOY\.md|package(-lock)?\.json)$ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ~ /\. { return 404; }
    client_max_body_size 6m;

    location ^~ /backend/ {
        deny all;
        return 404;
    }
}

